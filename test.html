<!doctype html>
<html><head><meta charset="utf-8"><title>katch isolation tests</title>
<style>body{font-family:monospace;background:#0E0B19;color:#E3D9FF;padding:24px;font-size:13px} .pass{color:#7FB069}.fail{color:#E84A6F} button{margin:6px 0;padding:8px 14px}</style>
</head><body>
<h2>Katch RLS isolation tests - TEST PAGE, delete after use</h2>
<div id="log">not run</div>
<br><input id="pwa" type="password" placeholder="password A"> <input id="pwb" type="password" placeholder="password B"> <button id="run">Run all tests</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mkiuzakwiggcnxqabxzy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1raXV6YWt3aWdnY254cWFieHp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NzAxMzcsImV4cCI6MjEwOTI0NjEzN30.64buiVe94UvkA6fiBDeU6cwVrckgCTKsP02re7TX_DQ';
const USER_A = {email:'katch-test-a@example.com'};
const USER_B = {email:'katch-test-b@example.com'};
const out = [];
const line = (ok, msg) => { out.push(`<div class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}: ${msg}</div>`); document.getElementById('log').innerHTML = out.join(''); };
const info = (msg) => { out.push(`<div>${msg}</div>`); document.getElementById('log').innerHTML = out.join(''); };
document.getElementById('run').onclick = async () => {
  out.length = 0; USER_A.password = document.getElementById('pwa').value; USER_B.password = document.getElementById('pwb').value; if(!USER_A.password||!USER_B.password){ info('enter both test passwords'); return; }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  try {
    // 1. anonymous sees nothing
    await sb.auth.signOut();
    let r = await sb.from('user_state').select('user_id');
    line(!r.error && r.data.length === 0, `anonymous select returns 0 rows (got ${r.data ? r.data.length : 'err:'+(r.error||{}).message})`);

    // 2. user A signs in, writes private marker, reads it back
    let a = await sb.auth.signInWithPassword(USER_A);
    if(a.error){ line(false, 'user A sign-in: '+a.error.message); return; }
    const uidA = a.data.user.id;
    r = await sb.from('user_state').upsert({user_id: uidA, state:{marker:'A-secret-'+Date.now()}, updated_at:new Date().toISOString()});
    line(!r.error, 'user A can upsert own row' + (r.error?' - '+r.error.message:''));
    const markerA = (await sb.from('user_state').select('state').eq('user_id', uidA).single()).data.state.marker;

    // 3. user B signs in, cannot see A
    await sb.auth.signOut();
    let b = await sb.auth.signInWithPassword(USER_B);
    if(b.error){ line(false, 'user B sign-in: '+b.error.message); return; }
    const uidB = b.data.user.id;
    r = await sb.from('user_state').select('user_id, state');
    const seesA = (r.data||[]).some(row => row.user_id === uidA) || JSON.stringify(r.data||[]).includes(markerA);
    line(!r.error && !seesA, `user B select shows no user A data (rows visible: ${(r.data||[]).length})`);

    // 4. user B tries to overwrite A's row (zero-row update counts as blocked)
    r = await sb.from('user_state').update({state:{hacked:true}}).eq('user_id', uidA).select();
    line(!r.error && (r.data||[]).length === 0, `user B update on A's row affected ${(r.data||[]).length} rows (0 = blocked)`);
    r = await sb.from('user_state').delete().eq('user_id', uidA).select();
    line(!r.error && (r.data||[]).length === 0, `user B delete on A's row affected ${(r.data||[]).length} rows (0 = blocked)`);

    // 5. back as A: marker unchanged
    await sb.auth.signOut();
    await sb.auth.signInWithPassword(USER_A);
    r = await sb.from('user_state').select('state').eq('user_id', uidA).single();
    line(!r.error && r.data.state.marker === markerA && !r.data.state.hacked, `user A row intact after B's attack attempts (marker preserved, no 'hacked' key)`);
    await sb.auth.signOut();
    info('done. delete this page + test users after review.');
  } catch(e){ line(false, 'exception: '+e.message); }
};
</script></body></html>
